<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Portrait GIF Studio</title>
    <meta name="description" content="High-frame-rate Matrix digital rain portrait synthesizer and animated GIF generator with custom dark-shadow eyewear silhouettes." />
    <meta property="og:title" content="Matrix Portrait GIF Studio" />
    <meta property="og:description" content="High-frame-rate Matrix digital rain portrait synthesizer and animated GIF generator with custom dark-shadow eyewear silhouettes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch;
          if (typeof currentFetch === 'function') {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (newFetch) {
                if (typeof newFetch === 'function') {
                  currentFetch = newFetch;
                }
              },
            });
          }
        } catch (_e) {}
        window.addEventListener(
          'error',
          function (event) {
            if (event && event.filename && event.filename.indexOf('chrome-extension://') === 0) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body class="bg-[#050505] text-[#F4F7F5] antialiased selection:bg-[#00FF66]/20 selection:text-[#00FF66]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
